<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASA Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans+KR:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --crimson: #d7143a;
  --crimson-hi: #ff4062;
  --blood: #6e0a1e;
  --chrome: #b9bdc4;
  --chrome-lo: #6f747c;
  --gunmetal: #1b1c20;
  --black: #050506;
  --text: #e9eaee;
  --muted: #8d9099;
  --line: rgba(255,255,255,.08);

  --chrome-grad: linear-gradient(180deg, #fbfbfd 0%, #c9ccd2 18%, #7c818a 46%, #dfe1e5 54%, #a3a8b0 78%, #eceef1 100%);
  --brushed: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  --display: 'Michroma', 'IBM Plex Sans KR', sans-serif;
  --body: 'IBM Plex Sans KR', system-ui, sans-serif;
  --lcd: 'VT323', ui-monospace, monospace;
  --cover: none;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--body);
  color: var(--text);
  min-height: 100vh;
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(215,20,58,.22), transparent 60%),
    radial-gradient(700px 500px at 110% 110%, rgba(215,20,58,.12), transparent 60%),
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 100% 48px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 48px 100%,
    var(--black);
  padding: 40px 16px 64px;
  overflow-x: hidden;
}

button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--crimson-hi); outline-offset: 3px; }

.container { max-width: 1120px; margin: 0 auto; }

/* ───────── Logo ───────── */
header { text-align: center; margin-bottom: 40px; }
.logo {
  font-family: var(--display);
  font-size: clamp(1.7rem, 6vw, 3.4rem);
  letter-spacing: .04em;
  line-height: 1.1;
  background: var(--chrome-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 1px rgba(255,255,255,.4)) drop-shadow(0 4px 0 var(--blood)) drop-shadow(0 0 24px rgba(215,20,58,.45));
}
.logo .ext { font-size: .45em; vertical-align: .9em; }
.tagline { margin-top: 14px; color: var(--muted); font-size: .95rem; }
.tagline .spark { color: var(--crimson-hi); }

/* ───────── Layout ───────── */
.main-content {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
  gap: 28px;
  align-items: start;
}
.rim {
  min-width: 0;
  padding: 2px;
  background: var(--chrome-grad);
  border-radius: 30px;
  box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.8);
}

/* ───────── Player deck ───────── */
.deck {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 28px;
  background: var(--brushed), linear-gradient(165deg, #2c2d33 0%, #16171a 55%, #1f2024 100%);
  padding: 28px 32px 30px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 6px rgba(0,0,0,.6);
}
/* 커버 색이 은은하게 번지는 배경 */
.deck::before {
  content: '';
  position: absolute; inset: -20%;
  z-index: -1;
  background: var(--cover) center / cover no-repeat;
  filter: blur(60px) saturate(1.4);
  opacity: .28;
  transition: opacity .6s;
}

.deck-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px;
  font-family: var(--display);
  font-size: .62rem;
  letter-spacing: .12em;
  color: var(--chrome-lo);
}
.power { display: flex; align-items: center; gap: 8px; }
.led {
  width: 8px; height: 8px; border-radius: 50%;
  background: #3a0a14;
  box-shadow: inset 0 1px 1px rgba(0,0,0,.6);
  transition: background .2s, box-shadow .2s;
}
.is-playing .power .led { background: var(--crimson-hi); box-shadow: 0 0 8px var(--crimson-hi); }

/* 케이스 + 디스크 */
.media {
  position: relative;
  width: 100%;
  max-width: 460px;
  aspect-ratio: 3 / 2;
  margin: 0 auto 26px;
}
.jewel {
  position: absolute; left: 0; top: 0;
  height: 100%; aspect-ratio: 1;
  z-index: 2;
  padding: 0; border: none;
  border-radius: 6px;
  overflow: hidden;
  cursor: zoom-in;
  background: var(--gunmetal);
  box-shadow: 0 0 0 2px #d4d7dc, 0 0 0 3px #4a4e55, 0 18px 40px rgba(0,0,0,.75);
  transition: transform .25s;
}
.jewel:hover { transform: translateY(-2px); }
.jewel img { width: 100%; height: 100%; object-fit: cover; display: block; }
.jewel::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 7%;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.25) 0 1px, rgba(0,0,0,.35) 1px 3px), rgba(10,10,12,.55);
  box-shadow: 1px 0 0 rgba(255,255,255,.25);
}
.jewel::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(118deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,.08) 34%, transparent 35%, transparent 70%, rgba(255,255,255,.06) 100%);
  pointer-events: none;
}
.zoom-hint {
  position: absolute; right: 8px; bottom: 8px; z-index: 1;
  width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(5,5,6,.6);
  opacity: 0; transition: opacity .2s;
}
.zoom-hint svg { width: 16px; height: 16px; fill: #fff; }
.jewel:hover .zoom-hint, .jewel:focus-visible .zoom-hint { opacity: 1; }

.disc-slot {
  position: absolute;
  top: 4%; height: 92%; aspect-ratio: 1;
  left: 24%;
  z-index: 1;
  transition: left .8s cubic-bezier(.2,.9,.3,1);
}
.is-playing .disc-slot { left: 38.6%; }
.disc {
  width: 100%; height: 100%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle, rgba(0,0,0,.07) 0 1px, transparent 1px 3px),
    conic-gradient(from 20deg, #e4e6ea, #8e939b, #f7f8fa, #c7a3ab, #9aa0a8, #eef0f3, #ff9aae, #7d828a, #dadde1, #a9aeb6, #e4e6ea);
  box-shadow: 0 10px 26px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.4);
  position: relative;
  animation: spin 2.6s linear infinite;
  animation-play-state: paused;
}
.is-playing .disc { animation-play-state: running; }
@keyframes spin { to { transform: rotate(360deg); } }
.disc-label {
  position: absolute; inset: 22%;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 0 0 3px rgba(0,0,0,.35), 0 0 0 5px rgba(255,255,255,.35);
  background: var(--gunmetal);
}
.disc-label img { width: 100%; height: 100%; object-fit: cover; display: block; }
.disc-hub {
  position: absolute; inset: 44%;
  border-radius: 50%;
  background: var(--black);
  box-shadow: 0 0 0 4px #c9ccd2, 0 0 0 5px #6f747c, inset 0 2px 4px rgba(0,0,0,.9);
}

/* LCD */
.lcd {
  position: relative;
  border-radius: 12px;
  padding: 14px 18px 12px;
  background: radial-gradient(120% 140% at 50% 0%, #2a050c, #120205 70%);
  box-shadow: inset 0 3px 10px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,64,98,.15), 0 1px 0 rgba(255,255,255,.08);
  font-family: var(--lcd);
  color: var(--crimson-hi);
  text-shadow: 0 0 6px rgba(255,64,98,.7);
  overflow: hidden;
}
.lcd::after {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px);
  pointer-events: none;
}
.lcd-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; }
.lcd-small { font-size: 1.15rem; opacity: .75; white-space: nowrap; }
.lcd-title {
  font-family: var(--body);
  font-weight: 600;
  font-size: 1.35rem;
  margin: 2px 0;
}
.lcd-artist { font-family: var(--body); font-size: .95rem; opacity: .85; min-width: 0; flex: 1; }
.lcd-time { font-size: 2rem; line-height: 1; white-space: nowrap; }

/* 칸 안에서 흘러가는 글자 */
.marquee {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  min-width: 0;
  -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent);
          mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 24px), transparent);
}
.marquee:not(.on) { text-overflow: ellipsis; -webkit-mask-image: none; mask-image: none; }
.marquee > span { display: inline-block; }
.marquee.on > span { animation: marquee var(--dur, 10s) linear infinite; }
.marquee.on { -webkit-mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(90deg, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
@keyframes marquee { 0%, 8% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.eq { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
.eq i { width: 4px; height: 3px; background: var(--crimson-hi); box-shadow: 0 0 4px var(--crimson-hi); }
.is-playing .eq i { animation: eq .9s ease-in-out infinite alternate; }
.eq i:nth-child(2) { animation-delay: -.3s; }
.eq i:nth-child(3) { animation-delay: -.6s; }
.eq i:nth-child(4) { animation-delay: -.15s; }
.eq i:nth-child(5) { animation-delay: -.45s; }
@keyframes eq { from { height: 3px; } to { height: 16px; } }

/* progress groove */
.progress-bar {
  position: relative;
  height: 10px;
  margin: 18px 0 26px;
  border-radius: 5px;
  background: #050506;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.07);
  cursor: pointer;
}
.progress {
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 0%;
  border-radius: 5px;
  background: linear-gradient(180deg, var(--crimson-hi), var(--crimson) 50%, var(--blood));
  box-shadow: 0 0 10px rgba(215,20,58,.6);
}
.progress::after {
  content: '';
  position: absolute; right: -9px; top: 50%;
  width: 18px; height: 18px;
  transform: translateY(-50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #c9ccd2 45%, #6f747c);
  box-shadow: 0 2px 6px rgba(0,0,0,.8);
}

/* transport */
.controls { display: flex; justify-content: center; align-items: center; gap: 14px; }
.btn {
  position: relative;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: grid; place-items: center;
  color: #26272c;
  background: var(--chrome-grad);
  box-shadow: 0 0 0 1px rgba(0,0,0,.7), 0 6px 14px rgba(0,0,0,.6), inset 0 1px 0 #fff;
  transition: transform .1s, filter .2s;
  flex: none;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px) scale(.97); }
.btn svg { width: 20px; height: 20px; fill: currentColor; }
.btn.small { width: 40px; height: 40px; }
.btn.small svg { width: 16px; height: 16px; }
.btn.small::after {
  content: '';
  position: absolute; top: -8px; left: 50%;
  width: 5px; height: 5px; margin-left: -2.5px;
  border-radius: 50%;
  background: #3a0a14;
  transition: background .2s, box-shadow .2s;
}
.btn.small[aria-pressed="true"]::after { background: var(--crimson-hi); box-shadow: 0 0 8px var(--crimson-hi); }
.btn.small[aria-pressed="true"] { color: var(--crimson); }
.btn.play {
  width: 78px; height: 78px;
  margin: 0 6px;
  color: #fff;
  background: radial-gradient(circle at 50% 120%, #ff6a85, transparent 55%), linear-gradient(180deg, #ff2c52, #b00b2c 60%, #6e0a1e);
  box-shadow: 0 0 0 3px #d4d7dc, 0 0 0 4px #5d626a, 0 10px 26px rgba(215,20,58,.45), inset 0 -4px 10px rgba(0,0,0,.35);
}
.btn.play::before {
  content: '';
  position: absolute;
  top: 6px; left: 16%; right: 16%; height: 42%;
  border-radius: 50% 50% 45% 45%;
  background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0));
  pointer-events: none;
}
.btn.play svg { width: 28px; height: 28px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.4)); }
.btn.play .i-pause { display: none; }
.is-playing .btn.play .i-play { display: none; }
.is-playing .btn.play .i-pause { display: block; }

/* 하단 툴바: 좋아요 · 링크 · 볼륨 */
.toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 26px;
  padding: 10px 12px;
  border-radius: 14px;
  background: rgba(0,0,0,.28);
  box-shadow: inset 0 1px 3px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.05);
}
.tool-group { display: flex; align-items: center; gap: 6px; }
.tool {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border: none; border-radius: 999px;
  background: transparent;
  color: var(--chrome);
  font-size: .85rem;
  cursor: pointer;
}
.tool:hover { background: rgba(255,255,255,.07); color: #fff; }
.tool svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
.tool[aria-pressed="true"] { color: var(--crimson-hi); }
.tool .heart-on { display: none; }
.tool[aria-pressed="true"] .heart-on { display: block; }
.tool[aria-pressed="true"] .heart-off { display: none; }

.volume { display: flex; align-items: center; gap: 8px; }
.volume .tool { padding: 7px; }
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 110px; height: 6px;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--crimson) var(--v, 80%), #050506 var(--v, 80%));
  box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
  cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #c9ccd2 45%, #6f747c);
  box-shadow: 0 2px 5px rgba(0,0,0,.8);
}
input[type=range]::-moz-range-thumb {
  width: 16px; height: 16px; border: none; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff, #c9ccd2 45%, #6f747c);
}

/* lyrics */
.lyrics-section { margin-top: 14px; }
.disclosure {
  width: 100%;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px;
  border: none; border-radius: 12px;
  background: rgba(255,255,255,.04);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--text);
  font-size: .95rem; font-weight: 500;
  cursor: pointer;
}
.disclosure:hover { background: rgba(255,255,255,.07); }
.chev { width: 14px; height: 14px; fill: var(--chrome); transition: transform .3s; }
.disclosure[aria-expanded="true"] .chev { transform: rotate(180deg); }
.collapse { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease; }
.collapse.open { grid-template-rows: 1fr; }
.collapse > div { overflow: hidden; }
.lyrics-text {
  margin-top: 10px;
  padding: 18px 20px;
  max-height: 380px;
  overflow-y: auto;
  border-radius: 12px;
  background: rgba(8,8,10,.85);
  box-shadow: inset 0 2px 8px rgba(0,0,0,.8);
  line-height: 1.85;
  white-space: pre-line;
  word-break: keep-all;
  overflow-wrap: anywhere;
  color: #d8d9de;
  font-size: .95rem;
}
.no-lyrics { color: var(--muted); text-align: center; padding: 20px 0; }

/* ───────── Playlist window ───────── */
.window { border-radius: 22px; }
.rim-inner {
  border-radius: 20px;
  background: var(--brushed), linear-gradient(180deg, #1d1e22, #121316);
  overflow: hidden;
}
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--chrome-grad);
  color: #1d1e22;
  border-bottom: 1px solid #000;
}
.titlebar h2 { font-family: var(--display); font-size: .78rem; letter-spacing: .08em; font-weight: 400; }
.titlebar .count { font-size: .78rem; font-weight: 600; color: #3a3c42; }
.window-body { padding: 16px; }

.search-box {
  width: 100%;
  padding: 11px 16px;
  border: none; border-radius: 999px;
  background: #08080a;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06);
  color: var(--text);
  font: inherit; font-size: .95rem;
  outline: none;
}
.search-box::placeholder { color: #5f626a; }
.search-box:focus { box-shadow: inset 0 2px 5px rgba(0,0,0,.9), 0 0 0 2px var(--crimson); }

.tabs {
  display: flex; gap: 4px;
  margin: 12px 0;
  padding: 3px;
  border-radius: 999px;
  background: #08080a;
  box-shadow: inset 0 2px 4px rgba(0,0,0,.8);
}
.tab {
  flex: 1;
  padding: 7px 0;
  border: none; border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: .85rem; font-weight: 500;
  cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--chrome-grad); color: #1d1e22; }

.playlist { max-height: 600px; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
.playlist::-webkit-scrollbar, .lyrics-text::-webkit-scrollbar { width: 6px; }
.playlist::-webkit-scrollbar-thumb, .lyrics-text::-webkit-scrollbar-thumb { background: var(--chrome-lo); border-radius: 3px; }
.playlist::-webkit-scrollbar-track, .lyrics-text::-webkit-scrollbar-track { background: transparent; }

.song-item {
  width: 100%;
  display: grid;
  grid-template-columns: 22px 48px minmax(0,1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 10px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
  position: relative;
}
.song-item > * { pointer-events: none; }
.song-item:hover { background: rgba(255,255,255,.05); }
.song-item.active { background: linear-gradient(90deg, rgba(215,20,58,.22), rgba(215,20,58,.04)); }
.song-item.active::before {
  content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
  width: 3px; border-radius: 2px;
  background: var(--crimson-hi); box-shadow: 0 0 8px var(--crimson-hi);
}
.trk { font-family: var(--lcd); font-size: 1.15rem; color: var(--chrome-lo); text-align: right; }
.song-item.active .trk { color: var(--crimson-hi); }
.song-item img {
  width: 48px; height: 48px; border-radius: 6px; object-fit: cover; display: block;
  box-shadow: 0 0 0 1px rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.6);
  background: var(--gunmetal);
}
.song-meta { min-width: 0; }
.song-item-title { font-size: .95rem; font-weight: 500; }
.song-item-artist { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.song-duration { font-family: var(--lcd); font-size: 1.1rem; color: var(--muted); }
.liked-mark { width: 12px; height: 12px; fill: var(--crimson-hi); }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; font-size: .9rem; line-height: 1.6; }

/* ───────── Cover viewer ───────── */
.viewer {
  position: fixed; inset: 0; z-index: 50;
  display: grid; place-items: center;
  padding: 24px 16px;
  background: rgba(5,5,6,.88);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .25s, visibility 0s .25s;
}
.viewer.open { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .25s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.viewer figure { width: min(520px, 100%); text-align: center; transform: scale(.94); transition: transform .3s cubic-bezier(.2,.9,.3,1.2); }
.viewer.open figure { transform: scale(1); }
.viewer img {
  width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
  border-radius: 8px;
  box-shadow: 0 0 0 2px #d4d7dc, 0 0 0 3px #4a4e55, 0 30px 80px rgba(0,0,0,.8), 0 0 80px rgba(215,20,58,.25);
}
.viewer figcaption { margin-top: 18px; }
.viewer .v-title { font-size: 1.2rem; font-weight: 600; }
.viewer .v-artist { color: var(--crimson-hi); margin-top: 4px; }
.viewer .close {
  position: absolute; top: 16px; right: 16px;
  width: 44px; height: 44px;
}

/* toast */
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60;
  transform: translate(-50%, 20px);
  padding: 10px 18px;
  border-radius: 999px;
  background: var(--chrome-grad);
  color: #1d1e22;
  font-size: .9rem; font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,.6);
  opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 900px) {

    <text x='50%' y='54%' text-anchor='middle' dominant-baseline='middle' font-size='140' fill='#ff4062'>♪</text></svg>`);

const pad = n => String(n).padStart(2, '0');
const formatTime = s => isFinite(s) ? `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}` : '0:00';

function setCover(img, src) {
  img.onerror = () => { img.onerror = null; img.src = FALLBACK_COVER; };
  img.src = src || FALLBACK_COVER;
}

// ── 칸 안에서 흘러가는 글자
function setMarquee(el, text) {
  el.classList.remove('on');
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = text;
  el.appendChild(span);
  requestAnimationFrame(() => {
    if (span.scrollWidth <= el.clientWidth + 1) return;
    const gap = '    ✦    ';
    span.textContent = text + gap + text + gap;
    el.style.setProperty('--dur', Math.max(6, text.length * 0.38) + 's');
    el.classList.add('on');
  });
}

// ── 목록
function createSongItem(song, index) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'song-item' + (index === currentSongIndex ? ' active' : '');

  const trk = document.createElement('span');
  trk.className = 'trk'; trk.textContent = pad(index + 1);

  const img = document.createElement('img');
  img.alt = ''; img.loading = 'lazy';
  setCover(img, song.cover);

  const meta = document.createElement('div');
  meta.className = 'song-meta';
  const t = document.createElement('div');
  t.className = 'song-item-title marquee';
  const a = document.createElement('div');
  a.className = 'song-item-artist'; a.textContent = song.artist;
  meta.append(t, a);

  const side = document.createElement('div');
  side.className = 'song-side';
  const d = document.createElement('span');
  d.className = 'song-duration'; d.textContent = song.duration || '';
  side.appendChild(d);
  if (liked.has(song.title)) {
    side.insertAdjacentHTML('beforeend', '<svg class="liked-mark" viewBox="0 0 24 24" aria-label="좋아요한 곡"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12.1 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.7-3.4 6.7-8.5 11.3L12 21z"/></svg>');
  }

  btn.append(trk, img, meta, side);

  // 재생 중인 곡은 항상, 나머지는 마우스를 올렸을 때 제목이 흘러감
  const plain = () => { t.classList.remove('on'); t.innerHTML = ''; const s = document.createElement('span'); s.textContent = song.title; t.appendChild(s); };
  plain();
  if (index === currentSongIndex) requestAnimationFrame(() => setMarquee(t, song.title));
  else {
    btn.addEventListener('mouseenter', () => setMarquee(t, song.title));
    btn.addEventListener('mouseleave', plain);
  }

  btn.addEventListener('click', () => {
    if (index === currentSongIndex) { isPlaying ? pauseSong() : playSong(); return; }
    loadSong(index); playSong();
  });
  return btn;
}

function visibleSongs() {
  const q = searchTerm.toLowerCase();
  return songs.filter(s =>
    (view === 'all' || liked.has(s.title)) &&
    (s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)));
}

function renderPlaylist() {
  playlistEl.innerHTML = '';
  const list = visibleSongs();
  list.forEach(s => playlistEl.appendChild(createSongItem(s, songs.indexOf(s))));
  if (!list.length) {
    const e = document.createElement('p');
    e.className = 'empty';
    e.textContent = searchTerm
      ? `'${searchTerm}'와 맞는 곡이 없어요`
      : '아직 좋아요한 곡이 없어요. 플레이어의 하트를 눌러 모아보세요.';
    playlistEl.appendChild(e);
  }
  $('songCount').textContent = view === 'liked' ? `${liked.size}곡` : `${songs.length}곡`;
}

// ── 곡 로드
function loadSong(index, { resumeAt = 0 } = {}) {
  if (index < 0 || index >= songs.length) return;
  currentSongIndex = index;
  const song = songs[index];

  audio.src = song.audio;
  if (resumeAt) audio.addEventListener('loadedmetadata', () => { audio.currentTime = resumeAt; }, { once: true });

  setCover(cdCover, song.cover);
  setCover(discCover, song.cover);
  cdCover.onload = () => deck.style.setProperty('--cover', `url("${cdCover.currentSrc || cdCover.src}")`);

  setMarquee(titleEl, song.title);
  setMarquee(artistEl, song.artist);
  trackNo.textContent = `TRK ${pad(index + 1)}/${pad(songs.length)}`;
  progress.style.width = '0%';
  curTimeEl.textContent = '0:00';
  durEl.textContent = song.duration || '0:00';
  likeBtn.setAttribute('aria-pressed', liked.has(song.title));

  lyricsSection.hidden = false;
  if (song.lyrics) lyricsText.textContent = song.lyrics;
  else lyricsText.innerHTML = '<p class="no-lyrics">이 곡은 가사가 등록되지 않았어요</p>';
  lyricsText.scrollTop = 0;

  updateMediaSession(song);
  store.set('last', { index, time: resumeAt });
  renderPlaylist();
}

// ── 재생 제어
function playSong() {
  if (currentSongIndex === -1) loadSong(0);
  const p = audio.play();
  if (p && p.catch) p.catch(() => {});
  isPlaying = true;
  deck.classList.add('is-playing');
}
function pauseSong() {
  audio.pause();
  isPlaying = false;
  deck.classList.remove('is-playing');
}
function prevSong() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  loadSong(currentSongIndex <= 0 ? songs.length - 1 : currentSongIndex - 1);
  if (isPlaying) playSong();
}
function nextSong() {
  let i;
  if (isShuffle && songs.length > 1) {
    do { i = Math.floor(Math.random() * songs.length); } while (i === currentSongIndex);
  } else {
    i = (currentSongIndex + 1) % songs.length;
  }
  loadSong(i);
  if (isPlaying) playSong();
}

// ── 휴대폰 잠금화면/이어폰 버튼 연동
function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;
  let art = [];
  try { art = [{ src: new URL(song.cover, location.href).href, sizes: '512x512' }]; } catch {}
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, album: 'HASA_ARCHIVE', artwork: art });
  } catch {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: song.title, artist: song.artist, album: 'HASA_ARCHIVE' }); } catch {}
  }
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  const set = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  set('play', playSong);
  set('pause', pauseSong);
  set('previoustrack', prevSong);
  set('nexttrack', nextSong);
  set('seekto', e => { audio.currentTime = e.seekTime; });
}

// ── 이벤트
$('playBtn').addEventListener('click', () => isPlaying ? pauseSong() : playSong());
$('prevBtn').addEventListener('click', prevSong);
$('nextBtn').addEventListener('click', nextSong);

let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progress.style.width = pct + '%';
  progressBar.setAttribute('aria-valuenow', Math.round(pct));
  curTimeEl.textContent = formatTime(audio.currentTime);
  if (Date.now() - lastSave > 3000) { lastSave = Date.now(); store.set('last', { index: currentSongIndex, time: audio.currentTime }); }
});
audio.addEventListener('loadedmetadata', () => { durEl.textContent = formatTime(audio.duration); });
audio.addEventListener('ended', () => {
  if (isRepeat) { audio.currentTime = 0; playSong(); }
  else nextSong();
});
audio.addEventListener('error', () => {
  if (currentSongIndex === -1) return;
  pauseSong();
  setMarquee(artistEl, '음원 파일을 찾을 수 없어요');
});

function seek(clientX) {
  if (!audio.duration) return;
  const r = progressBar.getBoundingClientRect();
  audio.currentTime = Math.min(Math.max((clientX - r.left) / r.width, 0), 1) * audio.duration;
}
progressBar.addEventListener('click', e => seek(e.clientX));
progressBar.addEventListener('keydown', e => {
  if (!audio.duration) return;
  if (e.key === 'ArrowRight') audio.currentTime = Math.min(audio.currentTime + 5, audio.duration);
  if (e.key === 'ArrowLeft') audio.currentTime = Math.max(audio.currentTime - 5, 0);
});

function syncToggles() {
  repeatBtn.setAttribute('aria-pressed', isRepeat);
  shuffleBtn.setAttribute('aria-pressed', isShuffle);
}
repeatBtn.addEventListener('click', () => { isRepeat = !isRepeat; if (isRepeat) isShuffle = false; syncToggles(); });
shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; if (isShuffle) isRepeat = false; syncToggles(); });

// 좋아요
likeBtn.addEventListener('click', () => {
  if (currentSongIndex === -1) return toast('먼저 곡을 골라주세요');
  const t = songs[currentSongIndex].title;
  liked.has(t) ? liked.delete(t) : liked.add(t);
  store.set('liked', [...liked]);
  likeBtn.setAttribute('aria-pressed', liked.has(t));
  renderPlaylist();
});

// 링크 복사 — 받은 사람이 열면 그 곡이 바로 올라와 있음
$('shareBtn').addEventListener('click', async () => {
  if (currentSongIndex === -1) return toast('먼저 곡을 골라주세요');
  const url = location.href.split('#')[0] + '#track-' + (currentSongIndex + 1);
  try { await navigator.clipboard.writeText(url); toast('이 곡 링크를 복사했어요'); }
  catch { prompt('아래 링크를 복사하세요', url); }
});

// 볼륨
function applyVolume(v) {
  audio.volume = v / 100;
  volume.value = v;
  volume.style.setProperty('--v', v + '%');
  muteBtn.setAttribute('aria-pressed', v === 0);
  store.set('volume', v);
}
let lastVol = store.get('volume', 80) || 80;
volume.addEventListener('input', () => { const v = +volume.value; if (v) lastVol = v; applyVolume(v); });
muteBtn.addEventListener('click', () => applyVolume(+volume.value === 0 ? lastVol : 0));

// 가사 접기/펼치기
$('lyricsHeader').addEventListener('click', e => {
  const b = e.currentTarget, open = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', open);
  $('lyricsContent').classList.toggle('open', open);
});

// 검색 & 탭
$('searchBox').addEventListener('input', e => { searchTerm = e.target.value.trim(); renderPlaylist(); });
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  view = tab.dataset.view;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t === tab));
  renderPlaylist();
}));

// 커버 크게 보기
const viewer = $('viewer');
function openViewer() {
  if (currentSongIndex === -1) return;
  const s = songs[currentSongIndex];
  $('viewerImg').src = cdCover.src;
  $('viewerTitle').textContent = s.title;
  $('viewerArtist').textContent = s.artist;
  viewer.classList.add('open');
  viewer.setAttribute('aria-hidden', 'false');
  $('viewerClose').focus();
}
function closeViewer() {
  viewer.classList.remove('open');
  viewer.setAttribute('aria-hidden', 'true');
  $('jewel').focus();
}
$('jewel').addEventListener('click', openViewer);
$('viewerClose').addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });

// 토스트
let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// 키보드
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && viewer.classList.contains('open')) return closeViewer();
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.code === 'Space' && document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); isPlaying ? pauseSong() : playSong(); }
  if (e.key === 'n' || e.key === 'N') nextSong();
  if (e.key === 'p' || e.key === 'P') prevSong();
});

// 제목 칸 크기가 바뀌면 흘러가기 다시 계산
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentSongIndex === -1) return;
    const s = songs[currentSongIndex];
    setMarquee(titleEl, s.title); setMarquee(artistEl, s.artist); renderPlaylist();
  }, 200);
});

// ── 시작: 공유 링크 > 마지막으로 듣던 곡 순서로 불러오기
applyVolume(store.get('volume', 80));
setCover(cdCover); setCover(discCover);
const hash = location.hash.match(/^#track-(\d+)$/);
const last = store.get('last', null);
if (hash && songs[+hash[1] - 1]) loadSong(+hash[1] - 1);
else if (last && songs[last.index]) loadSong(last.index, { resumeAt: last.time || 0 });
else renderPlaylist();
</script>
</body>
</html>
