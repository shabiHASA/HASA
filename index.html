<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HASA Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans+KR:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header>
    <h1 class="logo">HASA_ARCHIVE<span class="ext">.zip</span></h1>
    <p class="tagline"><span class="spark">✦</span> ft.Doohide <span class="spark">✦</span></p>
  </header>

  <div class="main-content">
    <!-- 플레이어 -->
    <div class="rim">
      <section class="deck" id="deck" aria-label="플레이어">
        <div class="deck-top">
          <span>HASA-2000 DISC PLAYER</span>
          <span class="power"><span class="led"></span>PWR</span>
        </div>

        <div class="media">
          <div class="disc-slot">
            <div class="disc">
              <div class="disc-label"><img id="discCover" alt=""></div>
              <div class="disc-hub"></div>
            </div>
          </div>
          <button class="jewel" id="jewel" aria-label="앨범 커버 크게 보기">
            <img id="cdCover" alt="">
            <span class="zoom-hint"><svg viewBox="0 0 24 24"><path d="M15 3h6v6h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H15V3zM3 15h2v2.6l4.3-4.3 1.4 1.4L6.4 19H9v2H3v-6z"/></svg></span>
          </button>
        </div>

        <div class="lcd" aria-live="polite">
          <div class="lcd-row">
            <span class="lcd-small" id="trackNo">TRK --/--</span>
            <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          </div>
          <div class="lcd-title marquee" id="currentTitle"><span>곡을 골라 재생하세요</span></div>
          <div class="lcd-row">
            <span class="lcd-artist marquee" id="currentArtist"><span>—</span></span>
            <span class="lcd-time"><span id="currentTime">0:00</span><span class="lcd-small"> / <span id="duration">0:00</span></span></span>
          </div>
        </div>

        <div class="progress-bar" id="progressBar" role="slider" aria-label="재생 위치" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress" id="progress"></div>
        </div>

        <div class="controls">
          <button class="btn small" id="shuffleBtn" aria-pressed="false" aria-label="셔플" title="셔플">
            <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.2l-3 3.6-1.3-1.5L13.9 6H17V3zM3 6h4.1l9.7 11H17v-3l4 4-4 4v-3h-1.1L6.2 8H3V6zm0 10h3.2l2.3-2.6 1.3 1.5L7.1 18H3v-2z"/></svg>
          </button>
          <button class="btn" id="prevBtn" aria-label="이전 곡" title="이전 곡">
            <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
          </button>
          <button class="btn play" id="playBtn" aria-label="재생/일시정지">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <button class="btn" id="nextBtn" aria-label="다음 곡" title="다음 곡">
            <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
          </button>
          <button class="btn small" id="repeatBtn" aria-pressed="false" aria-label="한 곡 반복" title="한 곡 반복">
            <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><path d="M11.2 10h1.6v5h-1.4v-3.4l-.9.3v-1.1z"/></svg>
          </button>
        </div>

        <div class="toolbar">
          <div class="tool-group">
            <button class="tool" id="likeBtn" aria-pressed="false" title="좋아요">
              <svg class="heart-off" viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12.1 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.7-3.4 6.7-8.5 11.3L12 21zm-4.6-16C5.5 5 4 6.5 4 8.4c0 2.8 3 5.5 8 10l.1-.1c4.9-4.4 7.9-7.1 7.9-9.9C20 6.5 18.5 5 16.6 5c-1.4 0-2.8.9-3.3 2.2h-2.6C10.2 5.9 8.8 5 7.4 5z"/></svg>
              <svg class="heart-on" viewBox="0 0 24 24"><path d="M12 21l-1.5-1.3C5.4 15.1 2 12.1 2 8.4 2 5.4 4.4 3 7.4 3c1.7 0 3.4.8 4.6 2.1C13.2 3.8 14.9 3 16.6 3 19.6 3 22 5.4 22 8.4c0 3.7-3.4 6.7-8.5 11.3L12 21z"/></svg>
              <span class="label">좋아요</span>
            </button>
            <button class="tool" id="shareBtn" title="이 곡 링크 복사">
              <svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3.5-3.5a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.5 19.8a4.3 4.3 0 0 1-3-7.3l2.1-2.1 1.4 1.4-2.1 2.1a2.3 2.3 0 0 0 3.2 3.2l2.1-2.1 1.4 1.4-2.1 2.1a4.3 4.3 0 0 1-3 1.3zm8-6.2-1.4-1.4 2.1-2.1A2.3 2.3 0 0 0 14 6.9l-2.1 2.1-1.4-1.4 2.1-2.1a4.3 4.3 0 0 1 6.1 6.1l-2.2 2z"/></svg>
              <span class="label">링크 복사</span>
            </button>
          </div>
          <div class="volume">
            <button class="tool" id="muteBtn" aria-pressed="false" title="음소거">
              <svg viewBox="0 0 24 24" id="volIcon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            </button>
            <input type="range" id="volume" min="0" max="100" value="80" aria-label="볼륨">
          </div>
        </div>

        <div class="lyrics-section" id="lyricsSection" hidden>
          <button class="disclosure" id="lyricsHeader" aria-expanded="false" aria-controls="lyricsContent">
            가사 보기
            <svg class="chev" viewBox="0 0 24 24"><path d="M5 8l7 8 7-8z"/></svg>
          </button>
          <div class="collapse" id="lyricsContent">
            <div><div class="lyrics-text" id="lyricsText"></div></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 플레이리스트 -->
    <div class="rim window">
      <div class="rim-inner">
        <div class="titlebar"><h2>PLAYLIST</h2><span class="count" id="songCount"></span></div>
        <div class="window-body">
          <input type="search" class="search-box" id="searchBox" placeholder="제목이나 아티스트로 찾기" aria-label="곡 검색">
          <div class="tabs" role="tablist">
            <button class="tab" role="tab" aria-selected="true" data-view="all">전체</button>
            <button class="tab" role="tab" aria-selected="false" data-view="liked">좋아요</button>
          </div>
          <div class="playlist" id="playlist"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 커버 크게 보기 -->
<div class="viewer" id="viewer" aria-hidden="true">
  <button class="btn close" id="viewerClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
  <figure>
    <img id="viewerImg" alt="">
    <figcaption><div class="v-title" id="viewerTitle"></div><div class="v-artist" id="viewerArtist"></div></figcaption>
  </figure>
</div>

<div class="toast" id="toast" role="status"></div>

<audio id="audioPlayer" preload="metadata"></audio>

<!-- 순서 중요: 곡 데이터 먼저, 그다음 플레이어 -->
<script src="songs.js"></script>
<script src="script.js"></script>
</body>
</html>
